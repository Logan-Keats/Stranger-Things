name: Maven CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build, package, and test
        run: xvfb-run -a mvn --batch-mode --no-transfer-progress verify

      - name: Generate Javadoc
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - name: Upload Javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stranger-things-javadoc
          path: target/javadoc/apidocs
          if-no-files-found: error

      - name: Upload executable JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stranger-things-executable-jar
          path: target/stranger-things-1.0-SNAPSHOT-executable.jar
          if-no-files-found: error

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Maven test results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  publish-javadoc-pages-artifact:
    name: Prepare Javadoc Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Generate Javadoc site
        run: mvn --batch-mode --no-transfer-progress javadoc:javadoc

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/javadoc/apidocs

  deploy-javadoc:
    name: Deploy Javadoc to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-javadoc-pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
